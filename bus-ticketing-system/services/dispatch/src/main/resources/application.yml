server:
  port: 8081

spring:
  application:
    name: dispatch-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bts}
    username: ${SPRING_DATASOURCE_USERNAME:bts}
    password: ${SPRING_DATASOURCE_PASSWORD:bts_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-DDL
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: dispatch-service
  gps-topic-filter: "bus/+/gps"
  alert-topic-template: "alerts/%s/stop"

dispatch:
  geofence:
    # A bus within this many meters of a stop with a pending request triggers an alert.
    threshold-meters: ${DISPATCH_GEOFENCE_THRESHOLD_METERS:300}
  redis:
    geo-index-key: "geo:index"
    pending-requests-key-prefix: "pending:"   # + routeId -> hash of stopId -> destination

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.bustransit.dispatch: INFO
