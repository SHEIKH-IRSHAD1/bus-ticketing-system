server:
  port: 8082

spring:
  application:
    name: ticketing-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bts}
    username: ${SPRING_DATASOURCE_USERNAME:bts}
    password: ${SPRING_DATASOURCE_PASSWORD:bts_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_replace_me}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_replace_me}
  # Base URL Stripe redirects back to after checkout. We already know our own
  # ticketId before creating the session, so StripeCheckoutService appends
  # "?ticketId={id}" itself rather than relying on Stripe's own
  # {CHECKOUT_SESSION_ID} placeholder, which is a *different* ID (the Stripe
  # session, not our ticket) and would leave the frontend with nothing to
  # poll /tickets/{ticketId}/status with.
  success-url-base: ${STRIPE_SUCCESS_URL_BASE:http://localhost:5173/ticket}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/cancelled}

ticket:
  hmac-secret: ${TICKET_HMAC_SECRET:dev_only_change_me_to_a_long_random_string}
  expiry-minutes: ${TICKET_EXPIRY_MINUTES:90}
  # Fixed price per ticket for this MVP - a real system would price by route/distance.
  price-amount-cents: ${TICKET_PRICE_CENTS:5000}
  price-currency: ${TICKET_PRICE_CURRENCY:usd}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.bustransit.ticketing: INFO
