# Mosquitto config for local development.
# Two listeners on purpose:
#   1883 - plain MQTT, used by the Java backend services and the GPS simulator
#   9001 - MQTT over WebSockets, used by browser clients (Driver Dashboard) that
#          cannot open a raw TCP socket the way a native MQTT client can.
#
# allow_anonymous is fine for local/dev use only. If you deploy this for real,
# add a password file (mosquitto_passwd) and set allow_anonymous false.

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
