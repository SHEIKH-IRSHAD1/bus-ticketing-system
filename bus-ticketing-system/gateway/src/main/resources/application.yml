server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cloud:
    gateway:
      routes:
        - id: ticketing-route
          uri: ${TICKETING_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/tickets/**,/api/webhooks/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@keyResolver}"

        - id: dispatch-route
          uri: ${DISPATCH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/stops/**,/api/routes/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@keyResolver}"

gateway:
  # Shared HMAC secret for JWT validation. See SecurityConfig for how this is
  # used and for the current (disabled-by-default) enforcement status.
  jwt-secret: ${GATEWAY_JWT_SECRET:dev_only_change_me_to_a_long_random_string_min_32_bytes}
  # Comma-separated origin patterns allowed to call the gateway from a browser.
  # The default allows any localhost port, which covers the Vite dev servers.
  cors-allowed-origin-patterns: ${GATEWAY_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
